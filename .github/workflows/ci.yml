name: Continuous Integration Hub

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Locked Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # [PRIORITÉ 5] Audit de securite strict et bloquant avec allowlist d'exclusions certifiees
    - name: Run Strict Cyber Security Dependency Audit (Pip Audit)
      run: |
        pip-audit -r requirements.txt --strict --ignore-file .pip-audit-ignore

    - name: Run Cyber Unit Tests (Pytest)
      run: |
        export PYTHONPATH=.
        python -m pytest tests/ -v
