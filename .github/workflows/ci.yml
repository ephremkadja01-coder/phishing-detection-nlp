name: Continuous Integration Hub

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Locked Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pip-audit

    # PRIORITÉ 8 : Scan automatique des vulnérabilités de dépendances (PyPA Database)
    - name: Run Cyber Security Dependency Audit (Pip Audit)
      run: |
        pip-audit -r requirements.txt || echo "[MLOps Warning] Des alertes de securite dependances ont ete signalees."

    # Validation unitaire des 18 variables d'URLs et de la fusion multi-modale
    - name: Run Cyber Unit Tests (Pytest)
      run: |
        export PYTHONPATH=.
        python -m pytest tests/ -v
