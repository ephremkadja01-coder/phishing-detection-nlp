name: Continuous Integration Hub

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupération du code source épuré du dépôt
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # 2. Configuration d'un environnement Python standardisé 3.12
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # 3. Installation des dépendances figées du projet
    - name: Install Locked Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Exécution stricte de la suite de tests unitaires pytest (Priorité 5 et 6)
    - name: Run Cyber Unit Tests (Pytest)
      run: |
        python -m pytest tests/ -v

    # 5. Validation de la syntaxe pure des fichiers Python maîtres
    - name: Validate Python Syntax Integrity
      run: |
        python -m py_compile app.py interface_web.py train_and_save_models.py
        print("[CI] Python operational syntax is perfectly sound.")
